# Render Blueprint — deploy backend RAG (be/) dạng Docker.
# Áp dụng: Render Dashboard → New → Blueprint → trỏ vào repo này.
# Spec: https://render.com/docs/blueprint-spec
#
# FE (fe/) KHÔNG deploy ở đây — FE lên Vercel (xem DEPLOY.md).

databases:
  - name: kltn-db
    plan: free # DB free dùng thử 90 ngày (sau đó bị xoá). Render Postgres mặc định UTF8 → OK.
    region: singapore # gần VN nhất
    databaseName: kltn_db
    postgresMajorVersion: "16"

services:
  # --- Redis (Render gọi là "Key Value"). Tài khoản/CLI cũ có thể là type: redis ---
  - type: keyvalue
    name: kltn-redis
    plan: free # Key Value free 25MB, đủ cho cache
    region: singapore
    ipAllowList: [] # rỗng = chỉ truy cập nội bộ Render (an toàn)
    maxmemoryPolicy: allkeys-lru

  # --- Backend FastAPI + RAG ---
  - type: web
    name: kltn-backend
    runtime: docker
    plan: free # MIỄN PHÍ: ngủ sau 15 phút không dùng (cold start ~30-50s khi gọi lại).
    # Nâng lên "starter" (~$7/th) nếu cần chạy liên tục + gắn disk (xem ghi chú UPLOAD_DIR).
    region: singapore
    rootDir: be # build context = thư mục be/
    dockerfilePath: ./Dockerfile # tương đối so với rootDir
    healthCheckPath: /
    autoDeploy: true

    # LƯU Ý plan free KHÔNG có disk → storage/ là TẠM (PDF upload mất sau mỗi deploy/restart/ngủ).
    # Đủ để demo. Muốn lưu bền: nâng plan >= starter rồi thêm lại block:
    #   disk: { name: uploads, mountPath: /app/storage, sizeGB: 1 }
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: /app/storage/uploads # tạm trên free; trỏ vào disk khi nâng plan

      # Cookie xuyên domain (FE vercel.app ↔ BE onrender.com) → bắt buộc SameSite=None + Secure
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      # Tự nối từ DB/Redis khai báo ở trên (URL nội bộ; config.py tự ép +asyncpg cho DB)
      - key: DATABASE_URL
        fromDatabase:
          name: kltn-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kltn-redis
          property: connectionString

      # SECRET_KEY ký JWT — để Render sinh ngẫu nhiên 1 lần
      - key: SECRET_KEY
        generateValue: true

      # --- BÍ MẬT: sync:false → Render hỏi giá trị khi áp blueprint (KHÔNG commit vào repo) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # JSON list các origin FE được phép gọi (CORS). VD: ["https://ten-app.vercel.app"]
      - key: ALLOWED_ORIGINS
        sync: false
      # Phoenix tracing (Phoenix Cloud). Để trống PHOENIX_ENABLED=false nếu chưa dùng.
      - key: PHOENIX_COLLECTOR_ENDPOINT
        sync: false
      - key: PHOENIX_API_KEY
        sync: false
